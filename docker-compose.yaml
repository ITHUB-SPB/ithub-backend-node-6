name: auth

services:
  postgres:
    image: postgres:18.6
    container_name: auth-postgres
    secrets:
      - db_user
      - db_password
    networks:
      - auth
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: /run/secrets/db_user
      POSTGRES_PASSWORD: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: "Europe/Moscow"
      PGTZ: "Europe/Moscow"
      LC_LANG: ru_RU.UTF-8
    volumes:
      - postgres:/var/lib/postgresql

  redis:
    image: redis:8.10-alpine
    container_name: auth-redis
    ports:
      - 6379:6379
    networks:
      - auth
    volumes:
      - redis:/data

  backend:
    container_name: auth-backend
    image: backend:latest
    build: .
    networks:
      - auth
    ports:
      - 8000:8000
    env_file:
      - .env
    command: node /app/dist/main.js

volumes:
  postgres:
  redis:

networks:
  auth:

secrets:
  db_user:
    file: db_user
  db_password:
    file: db_password