name: auth

services:
  postgres:
    image: postgres:18.6
    container_name: auth-postgres
    networks:
      - auth
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth
      TZ: "Europe/Moscow"
      PGTZ: "Europe/Moscow"
      LC_LANG: ru_RU.UTF-8
    volumes:
      - postgres:/var/lib/postgresql

  redis:
    image: redis:8.10-alpine
    container_name: auth-redis
    ports:
      - 6379:6379
    networks:
      - auth
    volumes:
      - redis:/data

  backend:
    container_name: auth-backend
    image: backend:latest
    build: .
    networks:
      - auth
    ports:
      - 8000:8000
    # command: npx dotenv run -f .env.production -- prisma migrate dev && node /app/dist/main.js
    command: node /app/dist/main.js

volumes:
  postgres:
  redis:

networks:
  auth:
