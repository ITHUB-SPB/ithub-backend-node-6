name: auth

services:
  postgres:
    image: postgres:18.6
    container_name: auth-postgres
    networks:
      - auth
    ports:
      - 5433:5432
    env_file:
      - .env.development
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-auth}
      TZ: "Europe/Moscow"
      PGTZ: "Europe/Moscow"
      LC_LANG: ru_RU.UTF-8
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres:/var/lib/postgresql

  redis:
    image: redis:8.10-alpine
    container_name: auth-redis
    ports:
      - 6379:6379
    networks:
      - auth
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    container_name: auth-backend
    image: backend:latest
    build: .
    networks:
      - auth
    ports:
      - 8000:8000
    env_file:
      - .env.development
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: node /app/dist/src/main.js

volumes:
  postgres:
  redis:

networks:
  auth:

secrets:
  postgres_password:
    file: .docker/secrets/postgres_password
